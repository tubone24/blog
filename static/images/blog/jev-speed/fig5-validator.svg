  <rect width="760" height="376" fill="#f8fafc"/>
  <text x="24" y="32" class="ttl">Jev の言い分と、機械的な正解の突き合わせ</text>
  <text x="194" y="76" class="hd">実際は合法（isStackable が true）</text>
  <text x="470" y="76" class="hd">実際は違反（false）</text>
  <text x="24" y="130" class="hd">Jev は積めると</text>
  <text x="24" y="150" class="hd">言った</text>
  <text x="24" y="174" class="mn" fill="#64748b" font-size="11.5">noul ≥ 0.5</text>
  <text x="24" y="242" class="hd">Jev は積めないと</text>
  <text x="24" y="262" class="hd">言った</text>
  <text x="24" y="286" class="mn" fill="#64748b" font-size="11.5">noul &lt; 0.5</text>
