  <g><rect x="470" y="195" width="20" height="28.0" rx="2.8" fill="#ffffff" stroke="#0d9488" stroke-width="1.3"/><text x="480.0" y="207.6" text-anchor="middle" font-family="'Hiragino Mincho ProN', 'Yu Mincho', Georgia, serif" font-size="12.4" font-weight="700" fill="#1f2937">6</text><path d="M50 6 C 50 6 10 36 10 58 C 10 72 21 81 32 81 C 39 81 45 77 48 71 C 47 80 43 88 35 94 L 65 94 C 57 88 53 80 52 71 C 55 77 61 81 68 81 C 79 81 90 72 90 58 C 90 36 50 6 50 6 Z" fill="#1f2937" transform="translate(475.80 210.96) scale(0.0840)"/></g>
